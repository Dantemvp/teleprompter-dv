<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Guiones · Consultora DV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<style>
  :root{
    --teal:#1D9E75; --teal-dark:#0F6E56; --teal-darker:#04342C; --teal-bg:#E1F5EE; --teal-soft:#9FE1CB;
    --gray-bg:#F1EFE8; --gray-dark:#444441; --ink:#1c1c1a; --muted:#76756e; --line:#e3e1d8; --paper:#fbfaf7;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--paper); color:var(--ink); line-height:1.6;}
  .wrap{max-width:760px; margin:0 auto; padding:28px 18px 80px;}
  header.site{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
  .logo{width:38px; height:38px; border-radius:50%; background:var(--teal-bg); color:var(--teal-dark); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; flex-shrink:0;}
  header.site h1{font-size:19px; font-weight:600;}
  header.site p{font-size:13px; color:var(--muted);}
  a{color:var(--teal-dark);}
  .meta-chips{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 4px;}
  .chip{font-size:12px; padding:4px 12px; border-radius:8px; background:var(--teal-bg); color:var(--teal-dark);}
  .chip.g{background:var(--gray-bg); color:var(--gray-dark);}
  .refbar{display:flex; align-items:center; gap:8px; margin:10px 0 18px; font-size:12px; color:var(--muted); flex-wrap:wrap;}
  .refbar code{background:var(--gray-bg); padding:3px 8px; border-radius:6px; font-size:11px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:inline-block; vertical-align:middle;}
  button{font:inherit; font-size:13px; padding:7px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); cursor:pointer;}
  button:hover{background:var(--gray-bg);}
  button.primary{background:var(--teal-dark); border-color:var(--teal-dark); color:#fff;}
  button.primary:hover{background:var(--teal-darker);}
  button.mini{font-size:11px; padding:3px 10px;}
  .tabs{display:flex; gap:6px; border-bottom:1px solid var(--line); margin:6px 0 22px;}
  .tabs button{border:none; background:none; border-radius:8px 8px 0 0; padding:9px 14px; color:var(--muted); border-bottom:2px solid transparent;}
  .tabs button.on{color:var(--teal-darker); border-bottom-color:var(--teal); font-weight:600; background:none;}
  .locbar{background:var(--gray-bg); padding:8px 12px; border-radius:10px;}
  .locpick{border:1px solid var(--teal); background:#fff; color:var(--teal-dark); border-radius:999px; cursor:pointer;}
  .locpick.on{background:var(--teal); color:#fff; font-weight:600;}
  .locchip{font-size:11px; padding:2px 9px; border-radius:999px; background:var(--teal); color:#fff; margin-left:6px;}
  .cardlocrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:8px 0 2px;}
  .cardloclbl{font-size:12px; color:var(--muted);}
  .cardloc{border:1px solid var(--teal); background:#fff; color:var(--teal-dark); border-radius:999px; cursor:pointer;}
  .cardloc.on{background:var(--teal); color:#fff; font-weight:600;}
  .catblock{border:1px solid var(--line,#e7e5df); border-radius:14px; padding:6px 16px; margin:0 0 16px;}
  .catblock>summary{cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; padding:12px 2px; font-weight:700; letter-spacing:.04em;}
  .catblock>summary::-webkit-details-marker{display:none;}
  .catblock>summary::before{content:'▸'; margin-right:10px; transition:transform .15s; color:var(--teal);}
  .catblock[open]>summary::before{transform:rotate(90deg);}
  .catname{flex:1;}
  .catcount{font-size:12px; font-weight:500; color:var(--muted); letter-spacing:0;}
  .catblock[open]>summary{border-bottom:1px solid var(--line,#e7e5df); margin-bottom:12px;}
  .globalnote{background:#fff7cc; border:1px solid #f0d878; color:#6b5800; border-radius:10px; padding:10px 14px; font-size:13px; font-weight:600; margin:0 0 16px;}
  .recblock2{border:1px solid var(--line,#e7e5df); border-radius:16px; padding:6px 16px; margin:0 0 18px; background:#fafaf8;}
  .recblock2>summary{cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; padding:14px 2px; font-weight:800; font-size:18px;}
  .recblock2>summary::-webkit-details-marker{display:none;}
  .recblock2>summary::before{content:'▸'; margin-right:10px; transition:transform .15s; color:var(--teal);}
  .recblock2[open]>summary::before{transform:rotate(90deg);}
  .recname{flex:1;}
  .recblock2 .catblock.sub{background:#fff; margin:0 0 12px;}
  .pickov{position:fixed; inset:0; background:rgba(14,15,14,.55); display:flex; align-items:center; justify-content:center; z-index:60; padding:20px;}
  .pickbox{background:#fff; border-radius:16px; padding:22px; max-width:420px; width:100%; box-shadow:0 18px 60px rgba(0,0,0,.3);}
  .pickgroup{margin-bottom:14px;}
  .pickgroup label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px;}
  .pickopts{display:flex; flex-wrap:wrap; gap:6px;}
  .pickopt{border:1px solid var(--teal); background:#fff; color:var(--teal-dark); border-radius:999px; cursor:pointer;}
  .pickopt.on{background:var(--teal); color:#fff; font-weight:600;}
  .pickbar{display:flex; justify-content:flex-end; gap:8px; margin-top:8px;}
  .beat{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:20px 0 8px;}
  .row{display:flex; gap:10px; margin-bottom:12px;}
  .row.right{flex-direction:row-reverse;}
  .avatar{width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; background:var(--gray-bg); color:var(--gray-dark);}
  .row.right .avatar, .row.solo .avatar{background:var(--teal-soft); color:var(--teal-darker);}
  .bubblewrap{max-width:82%;}
  .row.solo .bubblewrap{max-width:100%;}
  .bubble{padding:10px 14px; border-radius:14px; font-size:15px; background:#efede4;}
  .row.right .bubble, .row.solo .bubble{background:var(--teal-bg); color:var(--teal-darker);}
  .nota{font-size:12px; color:var(--muted); margin:4px 6px 0;}
  .row.right .nota{text-align:right;}
  body.hide-notas .nota{display:none;}
  body.editing .bubble, body.editing .nota, body.editing .beat, body.editing h1[contenteditable="true"]{outline:1.5px dashed var(--teal); outline-offset:3px; border-radius:8px;}
  body.editing .bubble:focus, body.editing .nota:focus, body.editing .beat:focus, body.editing h1:focus{outline:2px solid var(--teal);}
  .editbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; padding:10px 14px; background:var(--teal-bg); border-radius:10px;}
  .editbar span{font-size:12px; color:var(--teal-dark); margin-right:4px;}
  .banner{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; padding:10px 14px; background:#FAEEDA; border-radius:10px; font-size:12px; color:#854F0B;}
  .refreel{background:var(--teal-bg); border-radius:10px; padding:8px 14px;}
  .refreel span{color:var(--teal-dark);}
  .refreel a{color:var(--teal-darker); font-weight:600;}
  #v-edit .ein{width:100%; font:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; margin-bottom:6px;}
  #v-edit textarea.etext{min-height:62px; resize:vertical; line-height:1.5;}
  .efield{margin-bottom:12px;}
  .efield label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
  .erow{border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; background:#fff;}
  .erow.ebeat{background:var(--gray-bg);}
  .erowtop{display:flex; align-items:center; gap:6px; margin-bottom:6px;}
  .erowtop .espk{flex:1; margin-bottom:0; font-weight:500;}
  .eaddrow{display:flex; gap:6px;}
  .eaddrow .mini, .erowtop .mini{font-size:11px; padding:2px 9px;}
  .toolrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:18px;}
  pre.plain{white-space:pre-wrap; background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; font-size:14px; font-family:inherit;}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin-bottom:10px;}
  .card h3{font-size:15px; font-weight:600; margin-bottom:2px;}
  .card p{font-size:12px; color:var(--muted);}
  .card .actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .card.done{background:var(--teal-bg); border-color:var(--teal-soft);}
  .donechip{display:none; font-size:11px; background:var(--teal-dark); color:#fff; padding:3px 9px; border-radius:6px; align-self:center; white-space:nowrap;}
  .card.done .donechip{display:inline-block;}
  .card.done .btnGrabado{background:var(--teal-dark); border-color:var(--teal-dark); color:#fff;}
  .btnDel{color:#A32D2D; border-color:#F09595;}
  .btnDel:hover{background:#FCEBEB;}
  .recblock{margin-bottom:26px;}
  .rechead{display:flex; align-items:baseline; gap:10px; margin-bottom:12px; border-bottom:1px solid var(--line); padding-bottom:6px;}
  .rechead h2{font-size:17px; font-weight:600;}
  .rechead span{font-size:12px; color:var(--muted);}
  .codebadge{display:inline-flex; align-items:center; justify-content:center; min-width:52px; padding:4px 10px; border-radius:8px; background:var(--teal-darker); color:#fff; font-size:12px; font-weight:700; letter-spacing:.04em; flex-shrink:0;}
  textarea{width:100%; min-height:180px; font:inherit; font-size:13px; padding:12px; border:1px solid var(--line); border-radius:12px; background:#fff; resize:vertical;}
  .hint{font-size:12px; color:var(--muted); margin:8px 0 14px;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:13px; padding:9px 18px; border-radius:10px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:99;}
  .toast.show{opacity:1;}
  #tp{position:fixed; inset:0; background:#0e0f0e; color:#f5f4ef; display:none; z-index:50;}
  #tp.on{display:block;}
  #tpscroll{position:absolute; inset:0; overflow-y:auto; padding:45vh var(--tpmar,6vw);}
  #tptext{max-width:none; margin:0 auto;}
  #tptext .l{margin-bottom:1.2em;}
  #tptext .who{display:block; font-size:.42em; letter-spacing:.12em; opacity:.55; margin-bottom:.15em;}
  #tptext .l.spk1{color:#8a8a82;}
  #tptext .l.spk2{color:#fff;}
  #tptext .l.spk2 .who{color:var(--teal-soft); opacity:1;}
  #tpbar{position:fixed; left:0; right:0; bottom:0; display:flex; gap:14px; align-items:center; padding:12px 18px; background:rgba(14,15,14,.92); flex-wrap:wrap; z-index:51;}
  #tpbar label{font-size:11px; color:#8a8a82; display:flex; align-items:center; gap:8px;}
  #tpbar input[type=range]{width:110px; accent-color:var(--teal);}
  #tpbar button{background:#1d1f1d; border-color:#333; color:#eee;}
  .mirror #tptext{transform:scaleX(-1);}
  #tptext .tx{display:inline;}
  #tp.editing #tptext .tx{outline:1px dashed var(--teal-soft); border-radius:6px; padding:0 .15em; background:rgba(255,255,255,.04);}
  #tp.editing #tptext .tx:focus{outline:2px solid var(--teal); background:rgba(255,255,255,.08);}
  #tp.editing{cursor:text;}
  .pwmodal{position:fixed; inset:0; background:rgba(14,15,14,.5); display:none; align-items:center; justify-content:center; z-index:60; padding:18px;}
  .pwmodal.on{display:flex;}
  .pwbox{background:var(--paper); border-radius:14px; padding:20px; width:100%; max-width:360px;}
  .pwtitle{font-size:15px; font-weight:600; margin-bottom:12px;}
  .pwrow{display:flex; gap:8px; margin-bottom:14px;}
  .pwrow input{flex:1; font:inherit; font-size:15px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:#fff;}
  .pwactions{display:flex; gap:8px; justify-content:flex-end;}
  @media(max-width:520px){ .bubblewrap{max-width:88%;} .wrap{padding-top:18px;} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div id="tp">
  <div id="tpscroll"><div id="tptext"></div></div>
  <div id="tpbar">
    <button id="tpplay" class="primary">▶ Iniciar</button>
    <label>Velocidad <input type="range" id="tpspeed" min="10" max="200" value="55"></label>
    <label>Tamaño <input type="range" id="tpsize" min="22" max="80" value="44"></label>
    <label>Margen <input type="range" id="tpmargin" min="0" max="30" value="6"></label>
    <button id="tpmirror" class="mini">Espejo</button>
    <button id="tpedit" class="mini" style="display:none">✎ Editar</button>
    <button id="tpsave" class="primary mini" style="display:none">💾 Guardar</button>
    <button id="tpcanceledit" class="mini" style="display:none">Cancelar</button>
    <button id="tprestart" class="mini">Reiniciar</button>
    <button id="tpexit" class="mini">Salir (Esc)</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<div id="pwModal" class="pwmodal">
  <div class="pwbox">
    <p class="pwtitle" id="pwTitle">Contraseña</p>
    <div class="pwrow">
      <input type="password" id="pwInput" autocomplete="off" placeholder="••••••••">
      <button class="mini" id="pwToggle" type="button" aria-label="Mostrar contraseña">Ver</button>
    </div>
    <div class="pwactions">
      <button class="mini" id="pwCancel" type="button">Cancelar</button>
      <button class="primary mini" id="pwOk" type="button">Aceptar</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const attr = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); };
const copy = (txt,msg) => navigator.clipboard.writeText(txt).then(()=>toast(msg||'Copiado'));
const base = () => location.origin + location.pathname;
const DASH_TOKEN = 'dv-mando-9q2k7x';
const SAVE_ENDPOINT = 'https://teleprompter-dv.vercel.app/api/save';
const STATUS_ENDPOINT = 'https://teleprompter-dv.vercel.app/api/status';
const DELETE_ENDPOINT = 'https://teleprompter-dv.vercel.app/api/delete';
const ORGANIZE_ENDPOINT = 'https://teleprompter-dv.vercel.app/api/organize';
// Clientes con vista anidada de grabaciones (desplegable R6/R7…) + categorías adentro, con controles de crear/mover (admin).
const REC_NESTED = { 'bianca-ald-7q2vd': true, 'fedra-ald-t84qz': true };
// Clientes con selector de locutor (quién presenta el guion). Solo aplica a estos tokens.
const LOCUTORES = { 'skin-club-e67ff4': ['Nat', 'Kaori', 'Diego'] };
// Clientes donde el reel de referencia es privado: solo visible en modo edición (isAdmin()), no para el lector público.
const REF_PRIVATE = { 'skin-club-e67ff4': true };
// Aclaración global por cliente: se muestra como banner en cada guion y en el portal.
const CLIENT_NOTE = { 'bianca-ald-7q2vd': '📸 No olvidar tomar la foto en el mismo lugar.' };

function askPassword(title){
  return new Promise(resolve => {
    const modal = $('#pwModal'), input = $('#pwInput'), toggle = $('#pwToggle');
    $('#pwTitle').textContent = title || 'Contraseña';
    input.value = ''; input.type = 'password'; toggle.textContent = 'Ver';
    modal.classList.add('on');
    setTimeout(()=>input.focus(), 30);
    const done = val => { modal.classList.remove('on'); cleanup(); resolve(val); };
    const onOk = () => done(input.value);
    const onCancel = () => done(null);
    const onKey = e => { if(e.key==='Enter') onOk(); if(e.key==='Escape') onCancel(); };
    const onToggle = () => { const show = input.type==='password'; input.type = show?'text':'password'; toggle.textContent = show?'Ocultar':'Ver'; input.focus(); };
    function cleanup(){ $('#pwOk').onclick=null; $('#pwCancel').onclick=null; toggle.onclick=null; input.onkeydown=null; }
    $('#pwOk').onclick = onOk; $('#pwCancel').onclick = onCancel; toggle.onclick = onToggle; input.onkeydown = onKey;
  });
}

function rememberedPw(){ return localStorage.getItem('dvpw'); }
function forgetPw(){ localStorage.removeItem('dvpw'); }
async function unlock(title){
  let pw = rememberedPw();
  if (pw) return pw;                                       // recordada en este equipo (la valida el servidor)
  pw = await askPassword(title || 'Contraseña de escritura');
  if (pw === null) return null;
  localStorage.setItem('dvpw', pw);                        // si el servidor la rechaza (401) se borra y se vuelve a pedir
  return pw;
}
// Activa el "modo edición": revela los controles del estratega. El PIN no viaja a ningún servidor.
async function enableAdmin(){
  const p = await askPassword('PIN de edición (muestra los controles del estratega)');
  if (p === null) return false;
  if (p !== ADMIN_PIN){ toast('PIN incorrecto'); return false; }
  localStorage.setItem('dvadmin', p);
  return true;
}
const lockHtml = () => isAdmin()
  ? ' · <a href="#" class="lockBtn">🔒 bloquear este equipo</a>'
  : ' · <a href="#" class="adminBtn">🔑 modo edición</a>';
function wireLock(){
  document.querySelectorAll('.lockBtn').forEach(b => b.onclick = e => { e.preventDefault(); forgetPw(); localStorage.removeItem('dvadmin'); toast('Equipo bloqueado · pedirá PIN y contraseña de nuevo'); boot(); });
  document.querySelectorAll('.adminBtn').forEach(b => b.onclick = async e => { e.preventDefault(); if (await enableAdmin()){ toast('Modo edición activado'); boot(); } });
}

const LEGACY = {
  'podcast-01-aliwell-son-para-todos': ['ale-paz-mx27k','r2-01'],
  'podcast-02-brackets-vs-aliwell': ['ale-paz-mx27k','r2-02']
};

function parseGuion(src){
  const g = {title:'Guion', meta:[], lines:[], ref:null};
  let last = null;
  for (let raw of src.split('\n')){
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('# ')) { g.title = line.slice(2).trim(); continue; }
    if (line.startsWith('> ')) {
      const meta = line.slice(2).trim();
      const rm = meta.match(/^referencia:\s*(https?:\/\/\S+)/i);
      if (rm){ g.ref = rm[1]; continue; }
      g.meta.push(meta); continue;
    }
    if (line.startsWith('## ')) { g.lines.push({beat:line.slice(3).trim()}); last=null; continue; }
    if (line.startsWith('//')) { if(last) last.nota = (last.nota?last.nota+' ':'')+line.slice(2).trim(); continue; }
    const m = line.match(/^([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ0-9 .]{1,24}?):\s+(.*)$/);
    if (m){ last = {speaker:m[1].trim(), text:m[2].trim()}; g.lines.push(last); }
    else if (last && last.text){ last.text += ' ' + line; }
  }
  return g;
}

function speakerOrder(g){
  const seen = [];
  for (const l of g.lines) if (l.speaker && !seen.includes(l.speaker)) seen.push(l.speaker);
  return seen;
}

function plainText(g){
  const meta = g.meta.filter(m => isAdmin() || !m.trim().startsWith('✱'));   // la leyenda ✱ es solo para el admin
  let out = g.title.toUpperCase() + '\n' + meta.join('  ·  ') + '\n\n';
  for (const l of g.lines){
    if (l.beat) continue;
    out += l.speaker + ': ' + l.text + '\n\n';
  }
  return out.trim();
}

function toMarkdown(g){
  let out = '# ' + g.title + '\n';
  g.meta.forEach(m => out += '> ' + m + '\n');
  if (g.ref) out += '> Referencia: ' + g.ref + '\n';
  g.lines.forEach(l => {
    if (l.beat){ out += '\n## ' + l.beat + '\n'; return; }
    out += '\n' + l.speaker + ': ' + l.text + '\n';
    if (l.nota) out += '// ' + l.nota + '\n';
  });
  return out.trim() + '\n';
}
function downloadMd(name, text){
  const blob = new Blob([text], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
// PIN de UI: solo revela los controles del estratega (mover, eliminar, marcar, nueva grabación…).
// No da acceso de escritura por sí solo: cada guardado lo valida el servidor con la contraseña real.
const ADMIN_PIN = 'dvteam';
function isAdmin(){ return localStorage.getItem('dvadmin') === ADMIN_PIN; }
// Migración silenciosa: equipos que ya guardaron la contraseña de escritura siguen viendo los controles sin reconfigurar.
if (localStorage.getItem('dvpw') && localStorage.getItem('dvadmin') !== ADMIN_PIN) localStorage.setItem('dvadmin', ADMIN_PIN);

function renderGuion(g, canonical, backHref, opts){
  opts = opts || {};
  const spk = speakerOrder(g);
  const solo = spk.length < 2;
  let conv = '';
  const adm = isAdmin();   // solo el equipo DV (admin) ve las marcas ✱; la dra y lectores no
  g.lines.forEach((l, i) => {
    if (l.beat){ const bt = adm ? l.beat : l.beat.replace(/\s*✱\s*$/,''); conv += `<p class="beat" data-li="${i}">${esc(bt)}</p>`; return; }
    const idx = spk.indexOf(l.speaker);
    const cls = solo ? 'solo' : (idx===1 ? 'right' : '');

  $('#app').innerHTML = `

  const fileName = (opts.slug || g.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')) + '.md';

  $('#toggleNotas').onclick = () => {

  const editLineHtml = l => {
    const sp = l ? l.speaker : '';

    const nt = l && l.nota ? l.nota : '';
    return `<div class="erow eline">
      <div class="erowtop"><input class="ein espk" list="spklist" value="${attr(sp)}" placeholder="Personaje (DRA, ENTREVISTADOR...)">

      <textarea class="ein etext" placeholder="Lo que dice el personaje">${esc(tx)}</textarea>
      <input class="ein enota" value="${attr(nt)}" placeholder="Indicación de dirección (opcional)">
      <div class="eaddrow"><button class="mini eaddline">+ diálogo debajo</button><button class="mini eaddbeat">+ sección debajo</button></div>
    </div>`;
  };
  const editBeatHtml = b => `<div class="erow ebeat">
      <div class="erowtop"><input class="ein espk ebeatin" value="${attr(b)}" placeholder="Sección (ej. Beat 1 · La pregunta)">

      <div class="eaddrow"><button class="mini eaddline">+ diálogo debajo</button><button class="mini eaddbeat">+ sección debajo</button></div>
    </div>`;

  const buildForm = () => {
    const speakers = spk.length ? spk : ['DRA','ENTREVISTADOR'];
    const rows = g.lines.map(l => l.beat!==undefined ? editBeatHtml(l.beat) : editLineHtml(l)).join('');
    return `
      <div class="editbar"><span>Modo edición · agrega, mueve o elimina diálogos</span>${(SAVE_ENDPOINT && opts.client && opts.slug)?`<button class="primary mini" id="fCloud">☁ Guardar</button>`:`<button class="primary mini" id="fSave">Guardar local</button>`}<button class="mini" id="fDl">Descargar .md</button><button class="mini" id="fCancel">Cancelar</button></div>
      <div class="efield"><label>Título</label><input id="etitle" class="ein" value="${attr(g.title)}"></div>

      <datalist id="spklist">${speakers.map(s=>`<option value="${attr(s)}">`).join('')}</datalist>

    const lines = [];

        const speaker = (r.querySelector('.espk').value||'').replace(/\s*\n\s*/g,' ').trim() || 'DRA';
        const text = (r.querySelector('.etext').value||'').replace(/\s*\n\s*/g,' ').trim();
        const nota = (r.querySelector('.enota').value||'').replace(/\s*\n\s*/g,' ').trim();
        if (text || nota){ const o = {speaker, text}; if (nota) o.nota = nota; lines.push(o); }
      }
    });
    g.lines = lines;
    g.title = document.querySelector('#etitle').value.replace(/\s*\n\s*/g,' ').trim() || g.title;
    g.ref = document.querySelector('#eref').value.trim() || null;
  };

  $('#editBtn').onclick = async () => {
    const p = await unlock('Contraseña de edición');
    if (!p) return;
    $('#v-edit').innerHTML = buildForm();
    document.querySelector('.tabs').style.display = 'none';
    $('#v-conv').style.display = 'none';
    $('#v-plain').style.display = 'none';

      renderGuion(parseGuion(md), canonical, backHref, Object.assign({}, opts, {edited: false}));
    };
    const cloudBtn = $('#fCloud');
    if (cloudBtn) cloudBtn.onclick = async () => {
      if (!SAVE_ENDPOINT || !opts.client || !opts.slug){ toast('Guardado en la nube no configurado'); return; }
      collectForm();
      const pw = await unlock('Contraseña para publicar en la nube');
      if (!pw) return;
      const md = toMarkdown(g);
      cloudBtn.disabled = true; cloudBtn.textContent = 'Publicando...';
      try {
        const r = await fetch(SAVE_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw, client: opts.client, slug: opts.slug, content: md }) });
        if (r.status === 401){ forgetPw(); throw new Error('Contraseña incorrecta, intenta de nuevo'); }
        if (!r.ok) throw new Error(await r.text());
        if (opts.localKey){ localStorage.setItem(opts.localKey, md); localStorage.setItem(opts.localKey + ':t', Date.now()); }
        toast('Guardado ✓ Visible para todos en ~1 min');
        renderGuion(parseGuion(md), canonical, backHref, Object.assign({}, opts, {edited: false}));
      } catch (err) {
        cloudBtn.disabled = false; cloudBtn.textContent = '☁ Guardar';
        toast('Error al publicar: ' + (err.message||err));
      }
    };
    $('#addLine').onclick = () => $('#erows').insertAdjacentHTML('beforeend', editLineHtml(null));
    $('#addBeat').onclick = () => $('#erows').insertAdjacentHTML('beforeend', editBeatHtml(''));
    $('#erows').addEventListener('click', e => {
      const t = e.target, row = t.closest('.erow');
      if (!row) return;
      if (t.classList.contains('eaddline')) row.insertAdjacentHTML('afterend', editLineHtml(null));
      else if (t.classList.contains('eaddbeat')) row.insertAdjacentHTML('afterend', editBeatHtml(''));
      else if (t.classList.contains('edel')) row.remove();
      else if (t.classList.contains('eup')){ const p=row.previousElementSibling; if(p) row.parentNode.insertBefore(row,p); }
      else if (t.classList.contains('edown')){ const n=row.nextElementSibling; if(n) row.parentNode.insertBefore(n,row); }
    });
  };
}

// Etiquetas de cada categoría y el orden de secciones por cliente.
const CAT_LABELS = {
  'guion':     'GUIONES',
  'trans-int': 'TRANSICIONES · INTERIORES',
  'trans-ext': 'TRANSICIONES · EXTERIORES',
  'tienda':    'TIENDA · EMPLEADAS',
  'ugc':       'UGC',
  'influencer':'INFLUENCER',
  'idea':      'IDEAS FEDRA',
  'chusco':    'CHUSCO',
  '__otros':   'OTROS'
};
const CLIENT_CATS = {
  'bianca-ald-7q2vd': ['guion', 'chusco', 'trans-int', 'trans-ext', 'tienda'],
  'skin-club-e67ff4': ['guion', 'ugc', 'influencer'],
  'fedra-ald-t84qz': ['idea', 'guion', 'chusco']
};
// Prefijo del código visible (numeración posicional automática por grabación/categoría).
const CAT_PREFIX = { 'guion':'G', 'trans-int':'I', 'trans-ext':'E', 'tienda':'T', 'ugc':'U', 'influencer':'INF', 'idea':'ID', 'chusco':'C', '__otros':'X' };
// Devuelve los items de una grabación/lista que caen en una categoría; '__otros' captura todo lo que no esté en la lista conocida (para que nada desaparezca).
function itemsForCat(list, key, known){
  return key === '__otros'
    ? list.filter(it => !known.has(it.categoria || 'guion'))
    : list.filter(it => (it.categoria || 'guion') === key);
}
function renderCard(it, token, ri, codArg){
  const url = base() + '?c=' + token + '&g=' + it.slug;
  const cod = codArg || it.slug.toUpperCase();
  const esGuion = it.tipo !== 'ref' && it.categoria !== 'trans-int' && it.categoria !== 'trans-ext' && it.categoria !== 'chusco';   // .md abrible; transiciones, chusco y tarjetas de referencia (tipo:ref) solo llevan link
  const toggle = STATUS_ENDPOINT ? `<button class="mini btnGrabado" data-slug="${attr(it.slug)}" data-grabado="${it.grabado?1:0}">${it.grabado?'✓ Grabado':'Marcar grabado'}</button>` : '';
  const del = (DELETE_ENDPOINT && isAdmin()) ? `<button class="mini btnDel" data-slug="${attr(it.slug)}" data-cod="${attr(cod)}">Eliminar</button>` : '';
  const founders = LOCUTORES[token];
  let effLoc = it.locutor || null;
  if (founders){ const ls = localStorage.getItem('dvloc:' + token + '/' + it.slug); if (ls !== null) effLoc = ls || null; }
  const loc = (founders && effLoc) ? `<span class="locchip">🎙️ ${esc(effLoc)}</span>` : '';
  const cardLoc = (founders && isAdmin())
    ? `<div class="cardlocrow"><span class="cardloclbl">🎙️ Locutor:</span>${founders.map(n=>`<button class="mini cardloc${effLoc===n?' on':''}" data-slug="${attr(it.slug)}" data-loc="${attr(n)}">${esc(n)}</button>`).join('')}</div>`
    : '';
  const abrir = esGuion ? `<a href="?c=${token}&g=${it.slug}"><button class="primary mini">Abrir guion</button></a>` : '';
  const ref = it.link ? `<a href="${attr(it.link)}" target="_blank" rel="noopener"><button class="mini">Ver referencia ↗</button></a>` : '';
  const mover = (REC_NESTED[token] && isAdmin()) ? `<button class="mini btnMover" data-slug="${attr(it.slug)}">Mover ⇄</button>` : '';
  return `<div class="card${it.grabado?' done':''}" data-card="${attr(it.slug)}" data-rec="${ri}"><div style="display:flex; gap:12px; align-items:flex-start;"><span class="codebadge">${esc(cod)}</span><div style="flex:1"><h3>${esc(it.titulo)}${loc}</h3><p>${esc(it.info||'')}</p></div><span class="donechip">✓ Grabado</span></div>
    ${cardLoc}
    <div class="actions">${abrir}${ref}<button class="mini" onclick="copy('${url}','Link copiado')">Copiar link</button>${toggle}${mover}${del}</div></div>`;
}
let CLIENT_DATA = null, CLIENT_TOKEN = null;
function renderClient(data, token){
  CLIENT_DATA = data; CLIENT_TOKEN = token;
  const all = (data.grabaciones||[]).flatMap(rec => rec.guiones||[]);
  const admin = isAdmin();
  let cats = CLIENT_CATS[token];
  if (!cats && all.some(g => g.categoria)) cats = Object.keys(CAT_LABELS).filter(k => all.some(g => (g.categoria||'guion') === k));
  let blocks;
  if (REC_NESTED[token]){
    // Vista anidada: grabación (R6/R7…) → categorías adentro.
    const baseOrder = CLIENT_CATS[token] || Object.keys(CAT_LABELS).filter(k => k !== '__otros');
    const known = new Set(baseOrder);
    const hasOrphans = (data.grabaciones||[]).some(g => (g.guiones||[]).some(it => !known.has(it.categoria||'guion')));
    const order = hasOrphans ? baseOrder.concat(['__otros']) : baseOrder;
    let si = 0;
    blocks = (data.grabaciones||[]).map((g, gi) => {
      const inner = order.map(key => {
        const items = itemsForCat(g.guiones||[], key, known);
        if (!items.length) return '';
        const myi = si++;
        const done = items.filter(x=>x.grabado).length;
        return `<details class="catblock sub"><summary><span class="catname">${esc(CAT_LABELS[key]||key.toUpperCase())}</span><span class="catcount">${items.length} · <span class="donecount" data-rec="${myi}">${done}/${items.length} grabados</span></span></summary>${items.map((it,idx)=>renderCard(it,token,myi,(CAT_PREFIX[key]||'')+(idx+1))).join('')}</details>`;
      }).join('');
      const total = (g.guiones||[]).length, tdone = (g.guiones||[]).filter(x=>x.grabado).length;
      const body = inner || `<p class="hint" style="margin:6px 2px;">Grabación vacía. Mueve videos aquí con el botón "Mover ⇄" de cada tarjeta.</p>`;
      return `<details class="recblock2"><summary><span class="recname">🎬 ${esc(g.rec)} · ${esc(g.nombre||'Grabación')}</span><span class="catcount">${total} · ${tdone}/${total} grabados</span></summary>${body}</details>`;
    }).join('');
    if (admin) blocks = `<button class="primary mini" id="newRecBtn" style="margin:0 0 16px;">➕ Nueva grabación</button>` + blocks;
  } else if (cats){
    const known = new Set(cats);
    if (all.some(g => !known.has(g.categoria||'guion'))) cats = cats.concat(['__otros']);
    blocks = cats.map((key, ci) => {
      const items = itemsForCat(all, key, known);
      const done = items.filter(x=>x.grabado).length;
      const cards = items.length ? items.map((it, idx) => renderCard(it, token, ci, (CAT_PREFIX[key]||'')+(idx+1))).join('')
        : `<p class="hint" style="margin:6px 2px 2px;">Aún no hay nada aquí. Pásame el contenido y lo agrego.</p>`;
      return `<details class="catblock"><summary><span class="catname">${esc(CAT_LABELS[key]||key.toUpperCase())}</span><span class="catcount">${items.length} · <span class="donecount" data-rec="${ci}">${done}/${items.length} grabados</span></span></summary>${cards}</details>`;
    }).join('');
  } else {
    blocks = (data.grabaciones||[]).map((rec, ri) => {
      const total = (rec.guiones||[]).length;
      const done = (rec.guiones||[]).filter(x=>x.grabado).length;
      const cards = (rec.guiones||[]).map((it, idx) => renderCard(it, token, ri, 'G'+(idx+1))).join('');
      return `<div class="recblock"><div class="rechead"><h2>${esc(rec.rec)} · ${esc(rec.nombre||'Grabación')}</h2><span>${esc(rec.fecha||'')}${rec.locacion?' · '+esc(rec.locacion):''} · <span class="donecount" data-rec="${ri}">${done}/${total} grabados</span></span></div>${cards}</div>`;
    }).join('');
  }
  $('#app').innerHTML = `
    <header class="site"><div class="logo">DV</div><div><h1>${esc(data.cliente)}</h1><p>Tus guiones de grabación · Consultora DV</p></div></header>
    <p class="hint" style="margin:14px 0 26px;">Guarda este link: aquí aparecen tus contenidos por sección. Marca cada uno como grabado con la palomita.${lockHtml()}</p>
    ${CLIENT_NOTE[token] ? `<div class="globalnote">${esc(CLIENT_NOTE[token])}</div>` : ''}
    ${blocks || '<p class="hint">Aún no hay contenido publicado para este cliente.</p>'}`;
  document.querySelectorAll('.btnGrabado').forEach(b => b.onclick = () => toggleGrabado(token, b));
  document.querySelectorAll('.btnDel').forEach(b => b.onclick = () => deleteGuion(token, b));
  document.querySelectorAll('.cardloc').forEach(b => b.onclick = () => setLocutorCard(token, b));
  document.querySelectorAll('.btnMover').forEach(b => b.onclick = () => moveItemUI(b.dataset.slug));
  const nr = $('#newRecBtn'); if (nr) nr.onclick = () => newRecUI();
  wireLock();
  applyOpenState(); wireOpenPersist();
}

function detKey(d){
  if (d.classList.contains('recblock2')) return 'R:' + (d.querySelector(':scope > summary .recname')?.textContent || '');
  const rec = d.closest('.recblock2'); const rn = rec ? (rec.querySelector(':scope > summary .recname')?.textContent || '') : '';
  return 'C:' + rn + '/' + (d.querySelector(':scope > summary .catname')?.textContent || '');
}
// Estado de los desplegables por cliente (caché de sesión):
// al entrar o recargar el portal → todo cerrado; al regresar (botón atrás desde un guion) → como lo dejaste.
let RESTORE_OPEN = false;   // lo activa rerenderPreservingState para no perder lo abierto al mover/crear
const openKey = token => 'dvopen:' + token;
function loadOpenMap(token){ try { return JSON.parse(sessionStorage.getItem(openKey(token)) || '{}'); } catch(e){ return {}; } }
function saveOpenMap(token, map){ try { sessionStorage.setItem(openKey(token), JSON.stringify(map)); } catch(e){} }
function navIsBack(){ try { const e = performance.getEntriesByType('navigation'); return !!e[0] && e[0].type === 'back_forward'; } catch(e){ return false; } }
function applyOpenState(){
  if (!CLIENT_TOKEN) return;
  const dets = document.querySelectorAll('.recblock2, .catblock');
  if (!dets.length) return;
  const restore = RESTORE_OPEN || navIsBack();   // restaurar solo al volver atrás o en un re-render interno
  if (!restore) saveOpenMap(CLIENT_TOKEN, {});    // entrada o recarga: arrancar con todo cerrado
  const map = restore ? loadOpenMap(CLIENT_TOKEN) : {};
  dets.forEach(d => { d.open = map[detKey(d)] === true; });
}
function wireOpenPersist(){
  document.querySelectorAll('.recblock2, .catblock').forEach(d => {
    d.addEventListener('toggle', () => {
      if (!CLIENT_TOKEN) return;
      const map = loadOpenMap(CLIENT_TOKEN);
      map[detKey(d)] = d.open;
      saveOpenMap(CLIENT_TOKEN, map);
    });
  });
}
// Re-render conservando scroll y desplegables (al mover/crear no debe "saltar" ni cerrarse).
function rerenderPreservingState(){
  if (!CLIENT_DATA) return;
  const sy = window.scrollY;
  RESTORE_OPEN = true;
  renderClient(CLIENT_DATA, CLIENT_TOKEN);
  RESTORE_OPEN = false;
  window.scrollTo(0, sy);
}
async function orgCall(payload, okMsg){
  const pw = await unlock('Contraseña');
  if (!pw) { toast('Cancelado'); return false; }
  try {
    const r = await fetch(ORGANIZE_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw, client: CLIENT_TOKEN, ...payload }) });
    if (r.status === 401){ forgetPw(); throw new Error('Contraseña incorrecta'); }
    if (!r.ok) throw new Error(await r.text());
    toast(okMsg + ' (se refleja en ~1 min)');
    return true;
  } catch (e){ toast('Error: ' + (e.message||e)); return false; }
}
async function newRecUI(){
  const pick = await pickModal('Nueva grabación', [
    { name:'__rec', title:'Código (ej. R7)', input:true, placeholder:'R7' },
    { name:'__nombre', title:'Nombre (opcional)', input:true, placeholder:'Séptima grabación' }
  ]);
  if (!pick || !pick.__rec) return;
  const rec = pick.__rec.trim(), nombre = (pick.__nombre||'').trim();
  const ok = await orgCall({ action:'add-rec', rec, nombre }, 'Grabación creada');
  if (ok){   // refresco optimista: aparece de inmediato aunque la nube tarde ~1 min
    (CLIENT_DATA.grabaciones = CLIENT_DATA.grabaciones || []).unshift({ rec, nombre: nombre||rec, fecha:'Por definir', locacion:'', guiones:[] });
    rerenderPreservingState();
  }
}
async function moveItemUI(slug){
  const data = CLIENT_DATA, token = CLIENT_TOKEN; if (!data) return;
  const recs = (data.grabaciones||[]).map(g => g.rec);
  let curCat = 'guion';
  (data.grabaciones||[]).forEach(g => (g.guiones||[]).forEach(x => { if (x.slug===slug && x.categoria) curCat = x.categoria; }));
  const cats = (CLIENT_CATS[token] || Object.keys(CAT_LABELS));
  const pick = await pickModal('Mover "' + slug + '"', [
    { name:'toRec', title:'¿A qué grabación?', options: recs.map(r => ({ value:r, label:r })), selected: recs[0] },
    { name:'categoria', title:'¿Categoría?', options: cats.map(c => ({ value:c, label: CAT_LABELS[c]||c })), selected: curCat }
  ]);
  if (!pick) return;
  const ok = await orgCall({ action:'move', slug, toRec: pick.toRec, categoria: pick.categoria }, 'Movido a ' + pick.toRec);
  if (ok){   // refresco optimista
    let item = null;
    (CLIENT_DATA.grabaciones||[]).forEach(g => { const i=(g.guiones||[]).findIndex(x=>x.slug===slug); if(i>=0) item=g.guiones.splice(i,1)[0]; });
    if (item){ if (pick.categoria) item.categoria = pick.categoria; const t=(CLIENT_DATA.grabaciones||[]).find(g=>g.rec===pick.toRec); if(t){ t.guiones=t.guiones||[]; t.guiones.push(item); } }
    rerenderPreservingState();
  }
}
// Modal genérico de selección: groups = [{name, title, options:[{value,label}], selected} | {name,title,input:true,placeholder}]
function pickModal(title, groups){
  return new Promise(resolve => {
    const chosen = {};
    groups.forEach(g => { if (!g.input && g.selected!=null) chosen[g.name] = g.selected; });
    const ov = document.createElement('div'); ov.className = 'pickov';
    ov.innerHTML = `<div class="pickbox"><h3 style="margin:0 0 12px;">${esc(title)}</h3>${groups.map(g => g.input
      ? `<div class="pickgroup"><label>${esc(g.title)}</label><input class="ein pickinput" data-name="${attr(g.name)}" placeholder="${attr(g.placeholder||'')}"></div>`
      : `<div class="pickgroup"><label>${esc(g.title)}</label><div class="pickopts" data-name="${attr(g.name)}">${g.options.map(o=>`<button class="mini pickopt${g.selected===o.value?' on':''}" data-name="${attr(g.name)}" data-val="${attr(o.value)}">${esc(o.label)}</button>`).join('')}</div></div>`
    ).join('')}<div class="pickbar"><button class="mini" id="pickCancel">Cancelar</button><button class="primary mini" id="pickOk">Confirmar</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelectorAll('.pickopt').forEach(b => b.onclick = () => {
      ov.querySelectorAll(`.pickopt[data-name="${CSS.escape(b.dataset.name)}"]`).forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); chosen[b.dataset.name] = b.dataset.val;
    });
    const close = val => { ov.remove(); resolve(val); };
    ov.querySelector('#pickCancel').onclick = () => close(null);
    ov.querySelector('#pickOk').onclick = () => {
      ov.querySelectorAll('.pickinput').forEach(i => chosen[i.dataset.name] = i.value);
      close(chosen);
    };
    ov.onclick = e => { if (e.target===ov) close(null); };
  });
}

async function deleteGuion(token, btn){
  const slug = btn.dataset.slug, cod = btn.dataset.cod;
  if (!confirm(`¿Eliminar ${cod}? Esto borra el guion del vault y no se puede deshacer.`)) return;
  const pw = await unlock('Contraseña para eliminar');
  if (!pw) return;
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = 'Eliminando...';
  try {
    const r = await fetch(DELETE_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw, client: token, slug }) });
    if (r.status === 401){ forgetPw(); throw new Error('Contraseña incorrecta'); }
    if (!r.ok) throw new Error(await r.text());
    // Sincroniza la memoria local para que un re-render posterior no resucite la tarjeta borrada.
    if (CLIENT_DATA) (CLIENT_DATA.grabaciones||[]).forEach(rg => { rg.guiones = (rg.guiones||[]).filter(x => x.slug!==slug); });
    const card = document.querySelector(`.card[data-card="${CSS.escape(slug)}"]`);
    const ri = card && card.dataset.rec;
    if (card) card.remove();
    if (ri != null){
      const cards = document.querySelectorAll(`.card[data-rec="${ri}"]`);
      const d = [...cards].filter(c=>c.classList.contains('done')).length;
      const cnt = document.querySelector(`.donecount[data-rec="${ri}"]`);
      if (cnt) cnt.textContent = `${d}/${cards.length} grabados`;
    }
    toast('Guion eliminado ✓ (se actualiza en ~1 min)');
  } catch (e){
    btn.disabled = false; btn.textContent = old;
    toast('Error: ' + (e.message||e));
  }
}

async function toggleGrabado(token, btn){
  const slug = btn.dataset.slug;
  const next = btn.dataset.grabado !== '1';
  const pw = await unlock('Contraseña para marcar grabado');
  if (!pw) return;
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    const r = await fetch(STATUS_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw, client: token, slug, grabado: next }) });
    if (r.status === 401){ forgetPw(); throw new Error('Contraseña incorrecta'); }
    if (!r.ok) throw new Error(await r.text());
    btn.dataset.grabado = next ? '1' : '0';
    btn.textContent = next ? '✓ Grabado' : 'Marcar grabado';
    // Sincroniza la memoria local para que un re-render posterior (al mover/crear) no revierta la marca.
    if (CLIENT_DATA) (CLIENT_DATA.grabaciones||[]).forEach(rg => (rg.guiones||[]).forEach(x => { if (x.slug===slug) x.grabado = next; }));
    const card = document.querySelector(`.card[data-card="${CSS.escape(slug)}"]`);
    if (card){
      card.classList.toggle('done', next);
      const ri = card.dataset.rec;
      const cards = document.querySelectorAll(`.card[data-rec="${ri}"]`);
      const d = [...cards].filter(c=>c.classList.contains('done')).length;
      const cnt = document.querySelector(`.donecount[data-rec="${ri}"]`);
      if (cnt) cnt.textContent = `${d}/${cards.length} grabados`;
    }
    toast(next ? 'Marcado como grabado ✓ (visible en ~1 min)' : 'Desmarcado');
  } catch (e){
    toast('Error: ' + (e.message||e));
    btn.textContent = old;
  }
  btn.disabled = false;
}

// Guarda el locutor (local siempre + nube si se puede). Devuelve 'cloud', 'local:<msg>' o null si se canceló la contraseña.
async function saveLocutor(token, slug, next){
  const pw = await unlock('Contraseña para asignar locutor');
  if (!pw) return null;
  const lk = 'dvloc:' + token + '/' + slug;
  if (next) localStorage.setItem(lk, next); else localStorage.setItem(lk, '');   // '' = desasignado explícito (override del index.json)
  try {
    const r = await fetch(STATUS_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw, client: token, slug, locutor: next }) });
    if (r.status === 401){ forgetPw(); throw new Error('Contraseña incorrecta'); }
    if (!r.ok) throw new Error(await r.text());
    return 'cloud';
  } catch (e){
    return 'local:' + (e.message || e);
  }
}
const locToast = (next, res) => toast(
  res && res.startsWith('local')
    ? (next ? ('Locutor: ' + next + ' · guardado en este equipo') : 'Desasignado en este equipo')
    : (next ? ('Locutor: ' + next + ' ✓ (visible en ~1 min)') : 'Locutor desasignado ✓')
);

// Selector en la vista del guion (un solo grupo en pantalla).
async function setLocutor(token, slug, btn){
  const next = btn.classList.contains('on') ? '' : btn.dataset.loc;   // re-tocar el mismo = desasignar
  document.querySelectorAll('.locpick').forEach(x => x.classList.remove('on'));
  if (next) btn.classList.add('on');
  const res = await saveLocutor(token, slug, next);
  if (res === null){ boot(); return; }                                // canceló contraseña: re-render limpio
  locToast(next, res);
}

// Selector en cada tarjeta del portal (puede haber muchos grupos).
async function setLocutorCard(token, btn){
  const slug = btn.dataset.slug;
  const group = btn.closest('.cardlocrow');
  const next = btn.classList.contains('on') ? '' : btn.dataset.loc;
  group.querySelectorAll('.cardloc').forEach(x => x.classList.remove('on'));
  if (next) btn.classList.add('on');
  const card = document.querySelector(`.card[data-card="${CSS.escape(slug)}"]`);
  if (card){
    const h3 = card.querySelector('h3');
    let chip = card.querySelector('.locchip');
    if (next){ if (!chip){ chip = document.createElement('span'); chip.className = 'locchip'; h3.appendChild(chip); } chip.textContent = '🎙️ ' + next; }
    else if (chip){ chip.remove(); }
  }
  const res = await saveLocutor(token, slug, next);
  if (res === null){ boot(); return; }
  locToast(next, res);
}

async function renderAdmin(data, token){
  const cards = await Promise.all((data.clientes||[]).map(async cl => {
    let recs = [], nGuiones = 0;
    try{
      const idx = await (await fetch('clientes/' + cl.token + '/index.json?t=' + Date.now(), { cache:'no-store' })).json();
      recs = idx.grabaciones || [];
      nGuiones = recs.reduce((a,r)=>a+(r.guiones||[]).length, 0);
    }catch(e){}
    const portal = base() + '?c=' + cl.token;
    const recChips = recs.map(r=>{ const t=(r.guiones||[]).length, d=(r.guiones||[]).filter(x=>x.grabado).length; return `<span class="chip g">${esc(r.rec)} · ${t} guiones · ${d}/${t} grabados</span>`; }).join('');
    return `<div class="card">
      <div style="display:flex; gap:12px; align-items:flex-start;">
        <span class="codebadge" style="min-width:auto;">${esc(String(nGuiones))}</span>
        <div style="flex:1"><h3>${esc(cl.nombre)}</h3><p>${esc(cl.nicho||'')}</p></div>
      </div>
      <div class="meta-chips" style="margin:10px 0 0;">${recChips || '<span class="chip g">Sin guiones aún</span>'}</div>
      <div class="actions">
        <a href="?c=${cl.token}"><button class="primary mini">Abrir portal</button></a>
        <button class="mini" onclick="copy('${portal}','Link del portal copiado · listo para enviar a ${esc(cl.nombre).replace(/'/g,"\\'")}')">Copiar link del cliente</button>
      </div></div>`;
  }));
  $('#app').innerHTML = `
    <header class="site"><div class="logo">DV</div><div><h1>${esc(data.titulo||'Vault de guiones')}</h1><p>Dashboard del estratega · ${data.clientes.length} clientes</p></div></header>
    <p class="hint" style="margin:14px 0 24px;">Este link es solo tuyo: no lo compartas con clientes. Desde aquí navegas todos los portales y copias el link que le toca a cada quien.${lockHtml()}</p>
    ${cards.join('')}
    <p class="hint" style="margin-top:24px;"><a href="./">Ir a la página pública (pegar guion suelto)</a></p>`;
  wireLock();
}

let tpAnim = null, tpPlaying = false;
let TPCTX = null;   // {g, spk, opts, canonical, backHref} del guion abierto, para guardar ediciones en vivo
function openTP(g, spk){
  if (TPCTX){ TPCTX.g = g; TPCTX.spk = spk; } else { TPCTX = { g, spk }; }
  const t = $('#tptext');
  const solo = spk.length < 2;
  t.innerHTML = g.lines.map((l, i) => {
    if (l.beat) return '';
    const cls = (solo || spk.indexOf(l.speaker)===1) ? 'spk2' : 'spk1';
    return `<div class="l ${cls}" data-li="${i}"><span class="who">${esc(l.speaker)}</span><span class="tx">${esc(l.text)}</span></div>`;
  }).join('');
  t.style.fontSize = $('#tpsize').value + 'px';
  $('#tp').classList.add('on');
  $('#tpscroll').scrollTop = 0;
  setPlay(false);
  setTPEdit(false);
  $('#tpedit').style.display = (isAdmin()) ? '' : 'none';   // solo admin edita en vivo
}
function setTPEdit(on){
  $('#tp').classList.toggle('editing', on);
  document.querySelectorAll('#tptext .tx').forEach(sp => sp.contentEditable = on ? 'true' : 'false');
  $('#tpedit').style.display = on ? 'none' : (isAdmin() ? '' : 'none');
  $('#tpsave').style.display = on ? '' : 'none';
  $('#tpcanceledit').style.display = on ? '' : 'none';
  if (on){ setPlay(false); const first = document.querySelector('#tptext .tx'); if (first) first.focus(); }
}
async function saveTPEdits(){
  const ctx = TPCTX; if (!ctx || !ctx.g) return;
  document.querySelectorAll('#tptext .l').forEach(el => {
    const li = parseInt(el.dataset.li, 10);
    const tx = el.querySelector('.tx');
    if (!isNaN(li) && tx && ctx.g.lines[li]) ctx.g.lines[li].text = tx.innerText.replace(/\s*\n\s*/g,' ').trim();
  });
  const md = toMarkdown(ctx.g);
  if (ctx.opts && ctx.opts.localKey){ localStorage.setItem(ctx.opts.localKey, md); localStorage.setItem(ctx.opts.localKey + ':t', Date.now()); }
  let savedCloud = false;
  if (SAVE_ENDPOINT && ctx.opts && ctx.opts.client && ctx.opts.slug){
    const pw = await unlock('Contraseña para guardar en la nube');
    if (pw){
      $('#tpsave').disabled = true; $('#tpsave').textContent = 'Guardando...';
      try {
        const r = await fetch(SAVE_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw, client: ctx.opts.client, slug: ctx.opts.slug, content: md }) });
        if (r.status === 401){ forgetPw(); throw new Error('Contraseña incorrecta'); }
        if (!r.ok) throw new Error(await r.text());
        savedCloud = true;
      } catch (e){ toast('Nube: ' + (e.message||e)); }
      $('#tpsave').disabled = false; $('#tpsave').textContent = '💾 Guardar';
    }
  }
  setTPEdit(false);
  toast(savedCloud ? 'Cambios guardados ✓ (nube en ~1 min)' : 'Cambios guardados en este equipo');
}
function setPlay(p){
  tpPlaying = p;
  $('#tpplay').textContent = p ? '❚❚ Pausa' : '▶ Iniciar';
  if (p && !tpAnim) tick();
}
function tick(){
  tpAnim = requestAnimationFrame(()=>{ tpAnim=null;
    if (!tpPlaying) return;
    const sc = $('#tpscroll');
    sc.scrollTop += $('#tpspeed').value / 60;
    if (sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 2) { setPlay(false); return; }
    tick();
  });
}
$('#tpplay').onclick = () => setPlay(!tpPlaying);
$('#tpsize').oninput = e => $('#tptext').style.fontSize = e.target.value + 'px';
$('#tpmargin').oninput = e => $('#tpscroll').style.setProperty('--tpmar', e.target.value + 'vw');
$('#tpmirror').onclick = () => $('#tp').classList.toggle('mirror');
$('#tpedit').onclick = () => setTPEdit(true);
$('#tpsave').onclick = () => saveTPEdits();
$('#tpcanceledit').onclick = () => { setTPEdit(false); if (TPCTX) openTP(TPCTX.g, TPCTX.spk); };   // descarta y re-renderiza desde g
$('#tprestart').onclick = () => { $('#tpscroll').scrollTop = 0; setPlay(false); };
$('#tpexit').onclick = () => { setTPEdit(false); $('#tp').classList.remove('on'); setPlay(false); };
document.addEventListener('keydown', e => {
  if (!$('#tp').classList.contains('on')) return;
  if ($('#tp').classList.contains('editing')) return;   // no secuestrar teclas mientras se edita
  if (e.code === 'Space'){ e.preventDefault(); setPlay(!tpPlaying); }
  if (e.code === 'Escape'){ $('#tp').classList.remove('on'); setPlay(false); }
});

function renderHome(){
  $('#app').innerHTML = `
    <header class="site"><div class="logo">DV</div><div><h1>Guiones · Consultora DV</h1><p>Teleprompter y planeación de grabación</p></div></header>
    <p class="hint" style="margin:16px 0 30px;">Si eres cliente de la consultora, entra con el link personal que te compartió tu estratega. Ahí viven todas tus grabaciones y guiones.</p>
    <h2 style="font-size:15px; font-weight:600; margin:0 0 6px;">Pegar un guion suelto</h2>
    <p class="hint">Pega el diálogo (PERSONAJE: línea · "//" para indicaciones · "## " para secciones) y genera un link compartible al instante.</p>
    <textarea id="paste" placeholder="# Título del guion&#10;> Cliente: ...&#10;DRA: ...&#10;// indicación de dirección"></textarea>
    <div class="toolrow" style="margin-top:10px;"><button class="primary" id="genlink">Generar link</button><button id="prev">Previsualizar</button></div>
    <p class="hint" style="margin-top:30px; border-top:1px solid var(--line); padding-top:18px;"><button class="mini" id="adminAccess">🔑 Acceso estratega</button></p>`;
  $('#adminAccess').onclick = async () => {
    if (isAdmin() || await enableAdmin()) location.search = '?dv=' + DASH_TOKEN;
  };
  wireLock();
  $('#genlink').onclick = () => {
    const v = $('#paste').value.trim(); if(!v) return toast('Pega un guion primero');
    copy(base() + '#d=' + LZString.compressToEncodedURIComponent(v), 'Link generado y copiado');
  };
  $('#prev').onclick = () => {
    const v = $('#paste').value.trim(); if(!v) return toast('Pega un guion primero');
    location.hash = '#d=' + LZString.compressToEncodedURIComponent(v);
    boot();
  };
}

async function boot(){
  const q = new URLSearchParams(location.search);
  if (location.hash.startsWith('#d=')){
    const src = LZString.decompressFromEncodedURIComponent(location.hash.slice(3));
    if (src){ renderGuion(parseGuion(src), location.href, null); return; }
  }
  const adm = q.get('dv') ? q.get('dv').replace(/[^a-z0-9\-_]/gi,'') : null;
  if (adm){
    try{
      const r = await fetch('admin/' + adm + '.json');
      if (!r.ok) throw 0;
      await renderAdmin(await r.json(), adm);
      return;
    }catch(e){ $('#app').innerHTML = '<p style="padding:40px 0">Dashboard no encontrado.</p>'; return; }
  }
  let c = q.get('c') ? q.get('c').replace(/[^a-z0-9\-_]/gi,'') : null;
  let g = q.get('g') ? q.get('g').replace(/[^a-z0-9\-_]/gi,'') : null;
  if (!c && g && LEGACY[g]){ [c, g] = LEGACY[g]; }
  if (c && g){
    try{
      const r = await fetch('clientes/' + c + '/' + g + '.md?t=' + Date.now(), { cache:'no-store' });
      if (!r.ok) throw 0;
      const fetched = await r.text();
      const localKey = 'dvedit:' + c + '/' + g;
      let override = localStorage.getItem(localKey);
      const ots = +localStorage.getItem(localKey + ':t') || 0;
      // La copia local solo existe para puentear el ~1 min que tarda Pages en publicar.
      // Se descarta si ya coincide con lo publicado, o si caducó (10 min) — así una copia
      // vieja nunca tapa una versión más nueva (ni las copias legacy sin marca de tiempo).
      if (override && (override.trim() === fetched.trim() || (Date.now() - ots) > 600000)){
        localStorage.removeItem(localKey); localStorage.removeItem(localKey + ':t'); override = null;
      }
      let locutor = null;
      if (LOCUTORES[c]){
        try{
          const ix = await (await fetch('clientes/' + c + '/index.json?t=' + Date.now())).json();
          (ix.grabaciones||[]).forEach(rec => (rec.guiones||[]).forEach(it => { if (it.slug === g && it.locutor) locutor = it.locutor; }));
        }catch(e){}
        const local = localStorage.getItem('dvloc:' + c + '/' + g);
        if (local !== null) locutor = local || null;
      }
      renderGuion(parseGuion(override || fetched), base() + '?c=' + c + '&g=' + g, '?c=' + c, {localKey, slug:g, client:c, edited: false, locutor});
      return;
    }catch(e){ $('#app').innerHTML = '<p style="padding:40px 0">Guion no encontrado. Revisa el link con tu estratega.</p>'; return; }
  }
  if (c){
    try{
      const r = await fetch('clientes/' + c + '/index.json?t=' + Date.now(), { cache:'no-store' });
      if (!r.ok) throw 0;
      renderClient(await r.json(), c);
      return;
    }catch(e){ $('#app').innerHTML = '<p style="padding:40px 0">Cliente no encontrado. Revisa el link con tu estratega.</p>'; return; }
  }
  renderHome();
}
window.addEventListener('hashchange', boot);
boot();
